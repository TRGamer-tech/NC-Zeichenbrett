name: Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: PHP syntax
        run: find lib appinfo templates -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Translations complete
        run: node scripts/l10n.mjs
      - name: Build package
        run: ./package.sh
