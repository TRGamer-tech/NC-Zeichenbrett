# Builds the app and attaches zeichenbrett-<version>.tar.gz to the GitHub release.
# Triggered by publishing a release on GitHub (Releases -> Draft a new release, tag e.g. v1.2.0).
name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check version matches tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' appinfo/info.xml)
          test "v$VERSION" = "$TAG" || { echo "info.xml version $VERSION does not match tag $TAG"; exit 1; }
      - name: Build
        run: ./package.sh
      - name: Attach package to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG" dist/*.tar.gz --clobber
