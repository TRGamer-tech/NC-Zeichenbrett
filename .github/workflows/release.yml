# Push a tag like v1.2.0 -> builds the app and attaches zeichenbrett-1.2.0.tar.gz to a GitHub release.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check version matches tag
        run: |
          VERSION=$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' appinfo/info.xml)
          test "v$VERSION" = "$GITHUB_REF_NAME" || { echo "info.xml version $VERSION does not match tag $GITHUB_REF_NAME"; exit 1; }
      - name: Build
        run: ./package.sh
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz --title "$GITHUB_REF_NAME" --notes-file CHANGELOG.md
